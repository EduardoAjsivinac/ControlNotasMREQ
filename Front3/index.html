<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Control de Notas MREQ - Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "on-primary-container": "#86bde7",
                        "outline": "#71787f",
                        "surface": "#f8f9fa",
                        "surface-variant": "#e1e3e4",
                        "on-tertiary-container": "#ebab67",
                        "surface-container-high": "#e7e8e9",
                        "background": "#f8f9fa",
                        "surface-container-low": "#f3f4f5",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-tint": "#276489",
                        "surface-container-highest": "#e1e3e4",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#526772",
                        "tertiary-container": "#6b3e01",
                        "secondary": "#4c616c",
                        "inverse-surface": "#2e3132",
                        "on-surface": "#191c1d",
                        "surface-bright": "#f8f9fa",
                        "primary-fixed-dim": "#96cdf7",
                        "tertiary": "#4c2a00",
                        "tertiary-fixed": "#ffdcbd",
                        "on-secondary-fixed-variant": "#354a53",
                        "on-primary-fixed": "#001e2f",
                        "primary": "#003550",
                        "outline-variant": "#c1c7cf",
                        "primary-container": "#004d71",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#b4cad6",
                        "error": "#ba1a1a",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#004b6f",
                        "on-surface-variant": "#41484e",
                        "inverse-primary": "#96cdf7",
                        "on-background": "#191c1d",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d9dadb",
                        "on-tertiary-fixed-variant": "#693c00",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#cfe6f2",
                        "on-tertiary-fixed": "#2c1600",
                        "tertiary-fixed-dim": "#fcb974",
                        "secondary-container": "#cfe6f2",
                        "on-secondary-fixed": "#071e27",
                        "primary-fixed": "#c9e6ff",
                        "surface-container": "#edeeef"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface">
<!-- Auth Container -->
<div class="min-h-screen flex flex-col md:flex-row">
<!-- Left Side: Brand & Visual Anchor (Editorial Style) -->
<div class="w-full md:w-5/12 bg-primary relative overflow-hidden flex flex-col justify-between p-12 lg:p-20">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-30 grayscale brightness-50" data-alt="high-angle shot of a grand stone university library with soft morning light streaming through tall arched windows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAxQr4H5skfd8c8IqhAZfITXcA8ZqjMgDj1SW7zWKbYtLqNnEiWXr3mOK0kWkFhrGZBr312o1NpV50NeP8BSLR6q1j6UhwckfikpHPp-SCMd2uxXChmbXJ3cXmaKvLQ1_sMsF75sPaRf6uIoGjafCc406pUCCQwgVBTLIRyiqimxNA7rz2fQVeD6AyPcTpAX2H-U5O_VjA6WbjflLJ--5a_RpHin29x6w99Npom7VuNfWFiL_vez3hwdhIxXHdx-g-JpOvNidpyYjs"/>
<div class="absolute inset-0 bg-gradient-to-br from-primary via-primary-container to-transparent opacity-90"></div>
</div>
<!-- Content -->
<div class="relative z-10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed-dim text-4xl">school</span>
<h1 class="font-headline font-black text-2xl tracking-tight text-surface-container-lowest uppercase">Control de Notas MREQ</h1>
</div>
</div>

</div>
<!-- Right Side: Interaction Canvas -->
<div class="w-full md:w-7/12 flex items-center justify-center p-8 lg:p-24 bg-surface">
<div class="w-full max-w-2xl">
<!-- Toggle Navigation (Editorial Tab Style) -->
<div class="flex gap-12 mb-16 relative">
<button class="group relative py-2" id="login-tab">
<span class="font-headline text-sm font-bold tracking-widest uppercase text-primary">Ingresar</span>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-primary transform scale-x-100 transition-transform"></div>
</button>
<button class="group relative py-2" id="register-tab">
<span class="font-headline text-sm font-bold tracking-widest uppercase text-on-surface-variant group-hover:text-primary transition-colors">Registrarse</span>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-primary transform scale-x-0 group-hover:scale-x-50 transition-transform"></div>
</button>
</div>
<!-- Login Form View -->
<div class="space-y-10" id="login-form">
<header>
<h3 class="font-headline text-3xl font-extrabold text-on-surface mb-2 tracking-tight">Login</h3>
<p class="text-on-surface-variant font-medium">Ingrese sus credenciales para acceder al sistema.</p>
</header>
<form class="space-y-6">
<div class="space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">Codigo Unico de Identificación (DPI)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">badge</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant font-medium text-on-surface" placeholder="0000 00000 0000" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">Contraseña</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all placeholder:text-outline-variant font-medium text-on-surface" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-surface-container-lowest py-5 rounded-lg font-headline font-extrabold tracking-widest uppercase text-xs shadow-xl shadow-primary/10 hover:shadow-primary/20 active:scale-[0.98] transition-all">
                            <a href="./gesti_n_de_estudiantes/code.html" class="block w-full h-full">Ingresar</a>
                        </button>
</form>
</div>
<!-- Registration Form View (Asymmetric Grid) -->
<div class="hidden space-y-10" id="registration-form">
<header>
<h3 class="font-headline text-3xl font-extrabold text-on-surface mb-2 tracking-tight">New Scholar Enrollment</h3>
<p class="text-on-surface-variant font-medium">Join the academic ecosystem and manage your educational journey.</p>
</header>
<form class="space-y-6">
<!-- Bento Grid Input Layout -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-6">
<div class="space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">First Name</label>
<input class="w-full px-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all font-medium text-on-surface" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">Second Name</label>
<input class="w-full px-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all font-medium text-on-surface" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">First Surname</label>
<input class="w-full px-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all font-medium text-on-surface" type="text"/>
</div>
<div class="space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">Second Surname</label>
<input class="w-full px-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all font-medium text-on-surface" type="text"/>
</div>
<div class="md:col-span-2 space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">Identification (DPI)</label>
<input class="w-full px-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all font-medium text-on-surface" placeholder="0000 00000 0000" type="text"/>
</div>
<div class="md:col-span-2 space-y-1.5">
<label class="block text-[10px] font-bold uppercase tracking-[0.2em] text-on-surface-variant ml-1">Security Password</label>
<input class="w-full px-4 py-4 bg-surface-container-low border-none rounded-lg focus:ring-0 focus:bg-surface-container-lowest transition-all font-medium text-on-surface" placeholder="Min. 8 characters" type="password"/>
</div>
</div>
<div class="flex items-center gap-2 pt-2">
<input class="rounded-sm border-outline-variant text-primary focus:ring-primary/20" type="checkbox"/>
<span class="text-xs font-medium text-on-surface-variant">I agree to the <a class="text-primary font-bold underline decoration-primary/30 underline-offset-4" href="#">Academic Conduct Policy</a></span>
</div>
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-surface-container-lowest py-5 rounded-lg font-headline font-extrabold tracking-widest uppercase text-xs shadow-xl shadow-primary/10 hover:shadow-primary/20 active:scale-[0.98] transition-all">
                            Complete Registration
                        </button>
</form>
</div>
<!-- Footer Institutional Link -->
<footer class="mt-20 flex flex-col sm:flex-row items-center justify-between border-t border-outline-variant/15 pt-8 gap-4">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-outline-variant text-lg">verified_user</span>
</div>
</footer>
</div>
</div>
</div>
<!-- Background Pattern Accent -->
<div class="fixed top-0 right-0 p-8 pointer-events-none opacity-5">
<span class="material-symbols-outlined text-[300px] text-primary">account_balance</span>
</div>
</body></html>
